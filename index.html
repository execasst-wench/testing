<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Las Palmas · Sales & Expenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EEF3EF; --surface:#FFFFFF; --surface2:#F6F9F6; --ink:#15241C; --muted:#5B6D62; --line:#D3DDD5;
  --palm:#1E5B44; --palm-soft:#DCEBE2; --gold:#B87A0B; --gold-soft:#F7EBCF; --plum:#8B3355; --plum-soft:#F3DFE7;
  --focus:#2B7BD6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1813; --surface:#15231B; --surface2:#1A2B21; --ink:#E6EEE8; --muted:#9BAEA2; --line:#2A3D32;
    --palm:#62C196; --palm-soft:#1E3A2D; --gold:#E8B54C; --gold-soft:#3A2F17; --plum:#E07FA3; --plum-soft:#3D2230;
    --focus:#7DB8FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1813; --surface:#15231B; --surface2:#1A2B21; --ink:#E6EEE8; --muted:#9BAEA2; --line:#2A3D32;
  --palm:#62C196; --palm-soft:#1E3A2D; --gold:#E8B54C; --gold-soft:#3A2F17; --plum:#E07FA3; --plum-soft:#3D2230;
  --focus:#7DB8FF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;margin:0;line-height:1.15}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--palm);color:#fff}
:root[data-theme="dark"] header.top{background:#122A1F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header.top{background:#122A1F}}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-family:"IBM Plex Sans",sans-serif;font-size:12px;opacity:.75;font-weight:400}
.period{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.12);border-radius:10px;padding:3px}
.period button{background:none;border:0;color:#fff;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:18px}
.period button:hover{background:rgba(255,255,255,.15)}
.period select{background:transparent;border:0;color:#fff;font-weight:600;padding:6px 4px;cursor:pointer}
.period select option{color:#15241C}
nav.tabs{display:flex;gap:2px}
nav.tabs button{background:none;border:0;color:rgba(255,255,255,.75);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:500}
nav.tabs button[aria-selected="true"]{background:#fff;color:var(--palm)}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{background:var(--palm);color:#0E1813}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{background:var(--palm);color:#0E1813}}

.banner{margin:16px 0 0;padding:10px 14px;border-radius:10px;background:var(--gold-soft);color:var(--ink);font-size:14px}
.banner:empty{display:none}
main{padding:24px 0 60px}
.view[hidden]{display:none}

/* Report hero: the sheet's own formula as an equation */
.monthhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.monthhead h2{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.025em}
.monthhead .sub{color:var(--muted);font-size:14px}
.equation{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1.25fr;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.term{padding:18px 18px 16px;min-width:0}
.term .lbl{font-size:13px;color:var(--muted);display:block}
.term .val{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(18px,2.4vw,26px);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.term .delta{font-size:12.5px;color:var(--muted)}
.op{display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque",sans-serif;font-size:26px;color:var(--muted);padding:0 2px}
.term.inc .val{color:var(--palm)}
.term.exp .val{color:var(--plum)}
.term.soh .val{color:var(--gold)}
.term.net{background:var(--palm);color:#fff}
.term.net .lbl,.term.net .delta{color:rgba(255,255,255,.8)}
.term.net.neg{background:var(--plum)}
:root[data-theme="dark"] .term.net{color:#0E1813}:root[data-theme="dark"] .term.net .lbl,:root[data-theme="dark"] .term.net .delta{color:rgba(14,24,19,.75)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .term.net{color:#0E1813}:root:not([data-theme="light"]) .term.net .lbl,:root:not([data-theme="light"]) .term.net .delta{color:rgba(14,24,19,.75)}}
.booked{margin:8px 2px 0;color:var(--muted);font-size:13.5px}
.eqwrap{margin-top:18px}
.eqtitle{font-size:17px;font-weight:700;margin:0 2px 8px}
.equation.eq3{grid-template-columns:1fr auto 1fr auto 1.2fr}
.muted{color:var(--muted)}
.dtab{max-height:420px;overflow:auto}
.dtab thead th{position:sticky;top:0;background:var(--surface)}
.rows.cols2{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
.rows.cols2 .row:nth-child(2){border-top:0}
@media (max-width:860px){.rows.cols2{grid-template-columns:1fr}.rows.cols2 .row:nth-child(2){border-top:1px solid var(--line)}}
.booked b{color:var(--ink);font-weight:600}
@media (max-width:860px){
  .equation{grid-template-columns:1fr auto 1fr}
  .equation .op.o3{display:none}
  .term.net{grid-column:1/-1}
  .op.o2{display:none}
  .term.soh{grid-column:1/-1;border-top:1px solid var(--line)}
  .equation.eq3{grid-template-columns:1fr auto 1fr}
}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
@media (max-width:700px){header.top{position:static}nav.tabs button{padding:7px 9px;font-size:14px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;min-width:0}
.panel h3{font-size:18px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel h3 span{font-family:"IBM Plex Sans",sans-serif;font-size:13px;font-weight:500;color:var(--muted)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .name{font-size:14px}
.row .amt{font-weight:600;text-align:right;font-size:14px}
.row .bar{grid-column:1/-1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.row .bar i{display:block;height:100%;border-radius:3px}
.row .pct{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:6px}
.inc-bar i{background:var(--palm)} .exp-bar i{background:var(--plum)}
.dept{display:grid;grid-template-columns:1fr auto auto;font-size:14px}
.dept .r,.dept .h{padding-left:18px}
.dept .h:first-child{padding-left:0}
.dept .h{color:var(--muted);font-size:12.5px;text-align:right}
.dept .h:first-child{text-align:left}
.dept div{padding:7px 0;border-top:1px solid var(--line)}
.dept .h{border-top:0;padding-top:0}
.dept .r{text-align:right}
.dept .tot{font-weight:700}
.note{color:var(--muted);font-size:13px;margin:10px 0 0}
.chartbox{position:relative;height:260px}
.checks{list-style:none;margin:0;padding:0}
.checks li{padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.checks li:first-child{border-top:0}
.checks b{font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--palm)}
.btn.primary{background:var(--palm);border-color:var(--palm);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1813}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1813}}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Entry */
.entrybar{display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:18px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--palm-soft);color:var(--palm)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input{width:180px}
input.num{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;text-align:right;font-variant-numeric:tabular-nums}
input.num:disabled{background:var(--surface2)}
.saveState{font-size:13px;color:var(--muted);margin-left:auto}
.daypick{display:flex;align-items:center;gap:8px}
.daypick select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px}
.daypick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;cursor:pointer}
.dayform{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:860px){.dayform{grid-template-columns:1fr}}
.frow{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:0}
.frow label{font-size:14px}
.frow input{width:100%}
.daysum{display:flex;gap:24px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--muted)}
.daysum b{color:var(--ink);font-size:16px}

.gridwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.sheet{border-collapse:separate;border-spacing:0;font-size:13px}
table.sheet th,table.sheet td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
table.sheet thead th{position:sticky;background:var(--surface2);z-index:2;font-weight:600;text-align:left;vertical-align:bottom}
table.sheet thead tr.g th{top:0;height:30px;padding:6px 8px;font-family:"Bricolage Grotesque",sans-serif;font-size:14px}
table.sheet thead tr.c th{top:30px;padding:6px 8px;min-width:104px;max-width:120px;font-size:12px;line-height:1.3;white-space:normal}
th.g-inc{color:var(--palm)} th.g-exp{color:var(--plum)}
table.sheet .dcol{position:sticky;left:0;z-index:1;background:var(--surface2);padding:4px 10px;white-space:nowrap;min-width:72px;font-weight:600;text-align:left}
table.sheet thead .dcol{z-index:3}
table.sheet .dcol small{color:var(--muted);font-weight:400;margin-left:4px}
table.sheet td input{border:0;background:transparent;width:104px;padding:7px 8px;text-align:right;border-radius:0}
table.sheet td input:focus{background:var(--gold-soft);outline:2px solid var(--focus);outline-offset:-2px}
table.sheet tr.wk .dcol{color:var(--gold)}
table.sheet tfoot td{position:sticky;bottom:0;background:var(--surface2);font-weight:700;padding:7px 8px;text-align:right}
table.sheet tfoot .dcol{z-index:3}

/* Year */
table.yt{width:100%;border-collapse:collapse;font-size:14px}
table.yt th,table.yt td{padding:9px 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
table.yt th:first-child,table.yt td:first-child{text-align:left}
table.yt thead th{border-top:0;color:var(--muted);font-weight:500;font-size:13px}
table.yt tbody tr{cursor:pointer}
table.yt tbody tr:hover{background:var(--surface2)}
table.yt tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.pos{color:var(--palm)} .neg{color:var(--plum)}
.scrollx{overflow-x:auto}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
input[type=file]{display:none}

@media print{
  header.top,.actions,.banner,#view-entry,#view-year{display:none!important}
  body{background:#fff;color:#000}
  .panel,.equation{break-inside:avoid;border-color:#bbb}
  main{padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 30V14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M16 14C12 8 6 8 3 11c5-1 9 0 13 3zM16 14c4-6 10-6 13-3-5-1-9 0-13 3zM16 14c-1-6-5-10-9-10 4 2 7 6 9 10zM16 14c1-6 5-10 9-10-4 2-7 6-9 10z" fill="#E8B54C"/></svg>
      <h1>Las Palmas sales & expenses<small id="who">Monthly report</small></h1>
    </div>
    <div class="period" aria-label="Report month">
      <button id="prev" aria-label="Previous month">‹</button>
      <select id="mSel" aria-label="Month"></select>
      <select id="ySel" aria-label="Year"></select>
      <button id="next" aria-label="Next month">›</button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="report" aria-selected="true">Monthly report</button>
      <button role="tab" data-tab="entry" aria-selected="false">Daily entries</button>
      <button role="tab" data-tab="year" aria-selected="false">Year overview</button>
    </nav>
  </div>
</header>
<div class="wrap"><div class="banner" id="banner" role="status"></div></div>
<main class="wrap">
  <section class="view" id="view-report"></section>
  <section class="view" id="view-entry" hidden></section>
  <section class="view" id="view-year" hidden></section>
</main>
<input type="file" id="fileIn" accept=".xlsx,.xls">

<script>
"use strict";
/* ---------- Categories (column letters match the compilation sheet) ---------- */
const INCOME=[
 {k:"B",l:"Restaurant – daily sales collected",s:"Resto sales collected"},
 {k:"C",l:"Restaurant – sent bill / for collection",s:"Resto sent bill"},
 {k:"D",l:"Hotel – collected",s:"Hotel collected"},
 {k:"E",l:"Hotel – booked",s:"Hotel booked"},
 {k:"F",l:"Events & catering – collected",s:"Events collected"},
 {k:"G",l:"Events & catering – booked",s:"Events booked"},
 {k:"H",l:"Others – balance forwarded (+)",s:"Others bal. fwd (+)"},
 {k:"I",l:"Deposit back (encashment excess)",s:"Deposit back"}];
const EXPENSE=[
 {k:"J",l:"Food expense from RF (events & à la carte)",s:"Food from RF"},
 {k:"K",l:"Food expense with check (event liquidation)",s:"Food w/ check"},
 {k:"L",l:"Wet market with check – seafood & meat",s:"Wet mkt seafood/meat"},
 {k:"M",l:"Wet market with check – vegetables & others",s:"Wet mkt veg/others"},
 {k:"N",l:"Grocery & dry items – with check (suppliers)",s:"Grocery & dry"},
 {k:"O",l:"Parcel – online purchase",s:"Parcel online"},
 {k:"P",l:"FF&E (furniture, fixture & equipment)",s:"FF&E"},
 {k:"Q",l:"HK expense (rooms & pool) from RF & check",s:"HK rooms & pool"},
 {k:"R",l:"Office supplies, marketing & printing",s:"Office & marketing"},
 {k:"S",l:"Utilities – electricity & water",s:"Electricity & water"},
 {k:"T",l:"Utilities – kitchen gas",s:"Kitchen gas"},
 {k:"U",l:"Utilities – others (telecom, allowance & others)",s:"Utilities others"},
 {k:"V",l:"Water, ice cubes, ice block",s:"Water & ice"},
 {k:"W",l:"Repairs, labor service, misc.",s:"Repairs & labor"},
 {k:"X",l:"Cash advance, on-call pay, commission",s:"Cash adv / on-call"},
 {k:"Y",l:"Gov't fees, taxes, notary, bank fees",s:"Gov't fees & taxes"},
 {k:"Z",l:"Salaries and pay",s:"Salaries"},
 {k:"AA",l:"Govt contributions (SSS, HDMF, PhilHealth)",s:"SSS/HDMF/PhilHealth"},
 {k:"AB",l:"Staff meal",s:"Staff meal"},
 {k:"AC",l:"Staff/HR expenses (uniform, nameplate, etc.)",s:"Staff/HR"},
 {k:"AD",l:"Supplies Manila (Lanie/Agnes)",s:"Supplies Manila"},
 {k:"AE",l:"Others – balance forwarded (−)",s:"Others bal. fwd (−)"}];
const ALL=[...INCOME,...EXPENSE];
const COLLECTED=["B","D","F","H","I"];           // same as the sheet's G. TOTAL (COLLECTED)
const BOOKED=["B","C","D","E","G","H","I"];      // same as the sheet's G. TOTAL (BOOKED)
const EXPKEYS=EXPENSE.map(c=>c.k);
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const ORIG_HEADERS=["Month | Date","Restaurant (Income) DAILY SALES COLLECTED","Restaurant (Income) SENT BILL / FOR COLLECTION","Hotel (Income)   COLLECTED","Hotel (Income) BOOKED","Events/ Catering (Income) COLLECTED","Events/ Catering (Income) BOOKED","Others (Income) - Balance Forwarded (+)","Deposit Back (Encashment Excess)","Food Expense from RF (Events & Ala Carte)","Food Expense with Check (Event Liquidation)","Wet Market with Check - Seafood & Meat","Wet Market with Check- Vegetables and Others","Grocery & Dry Items - with check (Suppliers)","Parcel - Online Purchase","FF&E (Furniture, Fixture & Equipment)","HK Expense (Rooms & Pool) from RF & Check","Office Supplies, Marketing & Printing","Utilities - Electricity & Water","Utilities - Kitchen Gas","Utilities- Others (Telecom, Allowance & Others)","Water, Ice Cubes, Ice Block","Repairs, Labor Service, Misc.","Cash Advance, On Call Pay, Commission","Gov't Fees/ Taxes/ Notary/ Bank fees","Salaries and Pay","Govt Contributions  (SSS, HDMF, PHILHEALTH)","Staff Meal","Staff/HR Expenses (Uniform, Nameplate and etc.)","Supplies Manila (Lanie/Agnes)","Others (Expense) Balance Forwarded (-)","Stock on Hand (Stock Take Value)","Profit (Sales − Actual Expenses)"];

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const peso=n=>{n=Number(n)||0;return (n<0?"−₱":"₱")+Math.abs(n).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})};
const pesoShort=n=>{const a=Math.abs(n);const s=n<0?"−":"";if(a>=1e6)return s+"₱"+(a/1e6).toFixed(2)+"M";if(a>=1e3)return s+"₱"+(a/1e3).toFixed(0)+"k";return s+"₱"+a.toFixed(0)};
const r2=n=>Math.round((Number(n)||0)*100)/100;
const idOf=(y,m)=>y+"-"+String(m).padStart(2,"0");
const dim=(y,m)=>new Date(y,m,0).getDate();
const parseNum=s=>{s=String(s??"").replace(/[₱,\s]/g,"");if(s==="")return 0;const n=Number(s);return isFinite(n)?r2(n):NaN};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- State ---------- */
const today=new Date();
const S={remote:{},pending:{},y:today.getFullYear(),m:today.getMonth()+1,tab:"report",mode:"day",day:today.getDate(),

function deepMerge(a,b){const o=Array.isArray(a)?[...a]:{...(a||{})};for(const k in b){o[k]=(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k]))?deepMerge(o[k],b[k]):b[k]}return o}
function monthDoc(y,m){const id=idOf(y,m);let d=S.remote[id]||{year:y,month:m,days:{},soh:0};if(S.pending[id])d=deepMerge(d,S.pending[id]);return d}
function val(doc,day,k){return Number(doc.days?.[day]?.[k])||0}

function calc(y,m){
  const doc=monthDoc(y,m),n=dim(y,m),tot={};ALL.forEach(c=>tot[c.k]=0);
  const dIn=[],dOut=[],dRes=[],dBk=[];
  for(let d=1;d<=n;d++){let i=0,o=0;ALL.forEach(c=>{const v=val(doc,d,c.k);tot[c.k]+=v});
    COLLECTED.forEach(k=>i+=val(doc,d,k));EXPKEYS.forEach(k=>o+=val(doc,d,k));dIn.push(r2(i));dOut.push(r2(o));dRes.push(val(doc,d,"B"));dBk.push(r2(BOOKED.reduce((a,k)=>a+val(doc,d,k),0)))}
  for(const k in tot)tot[k]=r2(tot[k]);
  const sum=ks=>r2(ks.reduce((a,k)=>a+tot[k],0));
  const collected=sum(COLLECTED),booked=sum(BOOKED),expenses=sum(EXPKEYS),soh=Number(doc.soh)||0;
  const hasData=Object.keys(doc.days||{}).some(d=>Object.values(doc.days[d]||{}).some(v=>Number(v)))||soh>0;
  return {doc,n,tot,collected,booked,expenses,soh,net:r2(collected-expenses),netBooked:r2(booked-expenses),dIn,dOut,dRes,dBk,pCol:dIn.map((v,i)=>r2(v-dOut[i])),pBk:dBk.map((v,i)=>r2(v-dOut[i])),hasData};
}

/* ---------- Persistence ---------- */
let flushTimer=null,writing=false,again=false;
function setSave(t){const el=$("#saveState");if(el)el.textContent=t}
function edit(y,m,patch){
  if(!S.canWrite)return;
  const id=idOf(y,m);S.pending[id]=deepMerge(S.pending[id]||{},patch);
  setSave("Saving…");clearTimeout(flushTimer);flushTimer=setTimeout(flush,700);
}
async function flush(){
  if(writing){again=true;return}writing=true;
  try{
    if(S.localMode){
      for(const id in S.pending){S.remote[id]=deepMerge(S.remote[id]||{},S.pending[id]);delete S.pending[id]}
      try{localStorage.setItem(LS_KEY,JSON.stringify(S.remote))}catch(e){}
      setSave("Saved in this browser");
    }else{
      for(const id of Object.keys(S.pending)){
        const patch=S.pending[id];const [y,m]=id.split("-").map(Number);
        const ref=S.db.collection("months").doc(id);
        const body=deepMerge(patch,{updatedAt:new Date().toISOString()});
        try{
          if(S.remote[id])await ref.update(body);
          else await ref.set(deepMerge({year:y,month:m,days:{},soh:0},body));
          S.remote[id]=deepMerge(S.remote[id]||{year:y,month:m,days:{},soh:0},patch);
          if(S.pending[id]===patch)delete S.pending[id];
        }catch(e){
          if(e&&e.code==="invalid_argument"&&!S.remote[id]){/* may already exist */ 
            const snap=await ref.get();if(snap.exists){await ref.update(body);S.remote[id]=deepMerge(snap.data(),patch);if(S.pending[id]===patch)delete S.pending[id];continue}}
          if(e&&e.code==="invalid_argument"){S.canWrite=false;banner("You can view this report but not change it. Ask the owner for Contributor access to enter data.");render();}
          else banner("Couldn't save the last change ("+(e&&e.code||"error")+"). It will retry on your next edit.");
          setSave("Not saved");writing=false;return;
        }
      }
      setSave("All changes saved");
    }
  }finally{writing=false}
  if(again){again=false;flush()}
}
function banner(t){$("#banner").textContent=t||""}

    charts.daily=new Chart($("#cDaily"),{type:"bar",data:{labels:Array.from({length:c.n},(_,i)=>i+1),
      datasets:[{label:"Profit on collected payments",data:c.pCol,backgroundColor:cssVar("--palm"),borderRadius:3},{label:"Profit on sales on the books",data:c.pBk,backgroundColor:cssVar("--gold"),borderRadius:3}]},
      options:{maintainAspectRatio:false,animation:false,plugins:{legend:{labels:{color:ink,boxWidth:12}},tooltip:{callbacks:{title:x=>`${MONTHS[S.m-1]} ${x[0].label}`,label:x=>`${x.dataset.label}: ${peso(x.raw)}`}}},
      scales:{x:{grid:{display:false},ticks:{color:ink,maxRotation:0,autoSkipPadding:6}},y:{grid:{color:grid},ticks:{color:ink,callback:v=>pesoShort(v)}}}}});
  }
}

/* ---------- Entry ---------- */
function inputHtml(doc,d,k){const v=val(doc,d,k);return `<input class="num" inputmode="decimal" data-d="${d}" data-k="${k}" value="${v?v:""}" ${S.canWrite?"":"disabled"} aria-label="${esc((ALL.find(c=>c.k===k)||{l:k}).l)}, day ${d}">`}
function renderEntry(){
  const el=$("#view-entry");const c=calc(S.y,S.m);const doc=c.doc;
  const head=`<div class="entrybar">
    <div class="seg" role="group" aria-label="Entry layout"><button data-mode="day" aria-pressed="${S.mode==="day"}">One day</button><button data-mode="grid" aria-pressed="${S.mode==="grid"}">Whole month</button></div>
    <label class="field">Stock on hand (month-end stock take)<input class="num" id="sohIn" inputmode="decimal" value="${c.soh||""}" ${S.canWrite?"":"disabled"}></label>
    ${S.canWrite?`<button class="btn" id="impBtn">Import from Excel…</button>`:""}
    <span class="saveState" id="saveState" aria-live="polite">${S.canWrite?(S.localMode?"Saved in this browser":"All changes saved"):"View only"}</span></div>`;
  let body="";
  if(S.mode==="day"){
    const d=S.day,wd=DOW[new Date(S.y,S.m-1,d).getDay()];
    body=`<div class="daypick" style="margin-bottom:16px"><button id="dPrev" aria-label="Previous day">‹</button>
      <select id="dSel" aria-label="Day">${Array.from({length:c.n},(_,i)=>`<option value="${i+1}" ${i+1===d?"selected":""}>${MONTHS[S.m-1]} ${i+1}, ${DOW[new Date(S.y,S.m-1,i+1).getDay()]}</option>`).join("")}</select>
      <button id="dNext" aria-label="Next day">›</button></div>
      <div class="dayform">
        <div class="panel"><h3>Income</h3>${INCOME.map(cat=>`<div class="frow"><label for="f${cat.k}">${esc(cat.l)}</label>${inputHtml(doc,d,cat.k).replace("<input",`<input id="f${cat.k}"`)}</div>`).join("")}</div>
        <div class="panel"><h3>Expenses</h3>${EXPENSE.map(cat=>`<div class="frow"><label for="f${cat.k}">${esc(cat.l)}</label>${inputHtml(doc,d,cat.k).replace("<input",`<input id="f${cat.k}"`)}</div>`).join("")}</div>
      </div>
      <div class="daysum" id="daySum"></div>`;
  }else{
    body=`<div class="gridwrap"><table class="sheet"><thead>
      <tr class="g"><th class="dcol"></th><th class="g-inc" colspan="${INCOME.length}">Income</th><th class="g-exp" colspan="${EXPENSE.length}">Expenses</th></tr>
      <tr class="c"><th class="dcol">Day</th>${ALL.map(cat=>`<th title="${esc(cat.l)}">${esc(cat.s)}</th>`).join("")}</tr></thead><tbody>
      ${Array.from({length:c.n},(_,i)=>{const d=i+1,w=new Date(S.y,S.m-1,d).getDay();return `<tr class="${w===0||w===6?"wk":""}"><th class="dcol" scope="row">${d}<small>${DOW[w]}</small></th>${ALL.map(cat=>`<td>${inputHtml(doc,d,cat.k)}</td>`).join("")}</tr>`}).join("")}
      </tbody><tfoot><tr><td class="dcol">Total</td>${ALL.map(cat=>`<td data-t="${cat.k}">${peso(c.tot[cat.k]).replace("₱","")}</td>`).join("")}</tr></tfoot></table></div>`;
  }
  el.innerHTML=head+body+`<p class="note">Type an amount and move to the next box. Changes save on their own. Leave a box empty for zero.</p>`;
  el.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;render()});
  if(S.mode==="day"){
    $("#dSel").onchange=e=>{S.day=+e.target.value;render()};
    $("#dPrev").onclick=()=>{if(S.day>1){S.day--;render()}else{go(-1);S.day=dim(S.y,S.m);render()}};
    $("#dNext").onclick=()=>{if(S.day<c.n){S.day++;render()}else{S.day=1;go(1)}};
    updateDaySum();
  }
  const imp=$("#impBtn");if(imp)imp.onclick=()=>$("#fileIn").click();
  $("#sohIn").onchange=e=>{const n=parseNum(e.target.value);if(isNaN(n)){e.target.value=c.soh||"";return}edit(S.y,S.m,{soh:n})};
  el.querySelectorAll("input[data-k]").forEach(inp=>{
    inp.addEventListener("change",onCell);
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();moveFocus(inp,e.shiftKey?-1:1)}});
  });
}
function moveFocus(inp,dir){const all=[...document.querySelectorAll("#view-entry input[data-k]")];
  if(S.mode==="grid"){const d=+inp.dataset.d+dir;const n=document.querySelector(`#view-entry input[data-d="${d}"][data-k="${inp.dataset.k}"]`);if(n){n.focus();n.select()}return}
  const i=all.indexOf(inp)+dir;if(all[i]){all[i].focus();all[i].select()}}
function onCell(e){
  const inp=e.target,n=parseNum(inp.value);
  if(isNaN(n)){inp.setCustomValidity("Enter a number");inp.reportValidity();return}
  inp.setCustomValidity("");inp.value=n?String(n):"";
  edit(S.y,S.m,{days:{[inp.dataset.d]:{[inp.dataset.k]:n}}});refreshTotals();
}
function refreshTotals(){
  const c=calc(S.y,S.m);
  document.querySelectorAll("#view-entry td[data-t]").forEach(td=>td.textContent=peso(c.tot[td.dataset.t]).replace("₱",""));
  if(S.mode==="day")updateDaySum();
}
function updateDaySum(){const el=$("#daySum");if(!el)return;const doc=monthDoc(S.y,S.m),d=S.day;
  const i=COLLECTED.reduce((a,k)=>a+val(doc,d,k),0),o=EXPKEYS.reduce((a,k)=>a+val(doc,d,k),0);
  const bk=BOOKED.reduce((a,k)=>a+val(doc,d,k),0);
  el.innerHTML=`<span>Sales collected this day<br><b>${peso(i)}</b></span><span>Sales on the books this day<br><b>${peso(bk)}</b></span><span>Expenses this day<br><b>${peso(o)}</b></span>`}
function softRefreshEntry(){ // apply remote changes without stealing focus
  const doc=monthDoc(S.y,S.m);
  document.querySelectorAll("#view-entry input[data-k]").forEach(inp=>{if(inp===document.activeElement)return;const v=val(doc,inp.dataset.d,inp.dataset.k);inp.value=v?String(v):""});
  const s=$("#sohIn");if(s&&s!==document.activeElement)s.value=doc.soh||"";
  refreshTotals();
}

/* ---------- Year ---------- */
function renderYear(){
  const el=$("#view-year");killChart("year");
  const rows=MONTHS.map((nm,i)=>({...calc(S.y,i+1),i:i+1,nm}));const used=rows.filter(r=>r.hasData);
  if(!used.length){el.innerHTML=`<div class="monthhead"><h2>${S.y}</h2></div><div class="panel empty"><h3>No entries for ${S.y} yet</h3><p>Pick another year above, or import your compilation sheet from the Daily entries tab.</p></div>`;return}
  const T=k=>r2(used.reduce((a,r)=>a+r[k],0));
  el.innerHTML=`<div class="monthhead"><h2>${S.y}</h2><span class="sub">${used.length} month${used.length>1?"s":""} with entries. Click a month to open its report.</span></div>
  ${eqBlock("1. Profit on collected payments, year to date",NOTE_COL,"Sales collected",T("collected"),0,T("expenses"),0,T("net"),0,false)}
  ${eqBlock("2. Profit on sales on the books, year to date",NOTE_BK,"Sales on the books",T("booked"),0,T("expenses"),0,T("netBooked"),0,false)}
  <div class="panel" style="margin-top:22px"><h3>Profit month by month</h3><div class="chartbox"><canvas id="cYear"></canvas></div></div>
  <div class="panel" style="margin-top:20px"><div class="scrollx"><table class="yt"><thead><tr><th>Month</th><th>Sales collected</th><th>Sales on the books</th><th>Actual expenses</th><th>Profit (collected)</th><th>Profit (on the books)</th><th>Stock on hand</th></tr></thead><tbody>
    ${used.map(r=>`<tr data-m="${r.i}"><td>${r.nm}</td><td>${peso(r.collected)}</td><td>${peso(r.booked)}</td><td>${peso(r.expenses)}</td><td><b>${sgn(r.net)}</b></td><td><b>${sgn(r.netBooked)}</b></td><td class="muted">${peso(r.soh)}</td></tr>`).join("")}
  </tbody><tfoot><tr><td>Total</td><td>${peso(T("collected"))}</td><td>${peso(T("booked"))}</td><td>${peso(T("expenses"))}</td><td>${sgn(T("net"))}</td><td>${sgn(T("netBooked"))}</td><td></td></tr></tfoot></table></div>
  <p class="note">Stock on hand is shown for reference only and isn't included in either profit.</p></div>
  <div class="actions">${S.downloads?`<button class="btn primary" id="xYear">Download ${S.y} compilation (Excel)</button>`:""}</div>`;
  el.querySelectorAll("tbody tr").forEach(tr=>tr.onclick=()=>{S.m=+tr.dataset.m;S.tab="report";render()});
  if(S.downloads)$("#xYear").onclick=()=>exportYear(S.y);
  if(window.Chart){const ink=cssVar("--muted");
    charts.year=new Chart($("#cYear"),{type:"bar",data:{labels:used.map(r=>r.nm.slice(0,3)),datasets:[
      {label:"Profit on collected payments",data:used.map(r=>r.net),backgroundColor:cssVar("--palm"),borderRadius:4},
      {label:"Profit on sales on the books",data:used.map(r=>r.netBooked),backgroundColor:cssVar("--gold"),borderRadius:4}]},
      options:{maintainAspectRatio:false,animation:false,plugins:{legend:{labels:{color:ink,boxWidth:12}},tooltip:{callbacks:{label:t=>`${t.dataset.label}: ${peso(t.raw)}`}}},
      scales:{x:{grid:{display:false},ticks:{color:ink}},y:{grid:{color:cssVar("--line")},ticks:{color:ink,callback:v=>pesoShort(v)}}}}});
  }
}

/* ---------- Excel export ---------- */
const colL=i=>XLSX.utils.encode_col(i);
async function saveWb(wb,name){
  try{const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});await S.downloads.save({filename:name,data:new Blob([buf])})}
  catch(e){if(e&&e.code!=="declined")banner("Couldn't prepare the download ("+(e.code||e.message||"error")+").")}
}
function setF(ws,addr,f,v){ws[addr]={t:"n",f,v:r2(v),z:"#,##0.00"}}
function compilationSheet(y,months){
  const aoa=[ORIG_HEADERS,[],[y]];const fx=[];
  months.forEach(m=>{
    const c=calc(y,m);aoa.push([MONTHS[m-1].toUpperCase()]);const first=aoa.length+1;
    for(let d=1;d<=c.n;d++){aoa.push([d,...ALL.map(cat=>val(c.doc,d,cat.k)||null)])}
    const last=aoa.length,tr=aoa.length+1;aoa.push(["TOTAL"]);aoa.push(["G. TOTAL (COLLECTED)"]);aoa.push(["G. TOTAL    (BOOKED)"]);aoa.push([]);
    fx.push({first,last,tr,c});
  });
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  fx.forEach(({first,last,tr,c})=>{
    ALL.forEach((cat,i)=>setF(ws,colL(i+1)+tr,`SUM(${colL(i+1)}${first}:${colL(i+1)}${last})`,c.tot[cat.k]));
    ws["AF"+tr]={t:"n",v:c.soh,z:"#,##0.00"};
    const gc=tr+1,gb=tr+2,t=k=>k+tr;
    setF(ws,"B"+gc,COLLECTED.map(t).join("+"),c.collected);setF(ws,"B"+gb,BOOKED.map(t).join("+"),c.booked);
    setF(ws,"J"+gc,`SUM(J${tr}:AE${tr})`,c.expenses);setF(ws,"J"+gb,`SUM(J${tr}:AE${tr})`,c.expenses);
    setF(ws,"AF"+gc,"AF"+tr,c.soh);setF(ws,"AF"+gb,"AF"+tr,c.soh);
    setF(ws,"AG"+gc,`B${gc}-J${gc}`,c.net);setF(ws,"AG"+gb,`B${gb}-J${gb}`,c.netBooked);
  });
  ws["!cols"]=[{wch:22},...ALL.map(()=>({wch:15})),{wch:16},{wch:16}];
  return ws;
}
function exportYear(y){
  const months=MONTHS.map((_,i)=>i+1).filter(m=>calc(y,m).hasData);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,compilationSheet(y,months),"Compilation "+y);
  const sum=[["Month","Sales collected","Sales on the books","Actual expenses","Profit (collected)","Profit (on the books)","Stock on hand (reference)"]];
  months.forEach(m=>{const c=calc(y,m);sum.push([MONTHS[m-1],c.collected,c.booked,c.expenses,c.net,c.netBooked,c.soh])});
  const ws2=XLSX.utils.aoa_to_sheet(sum);ws2["!cols"]=[{wch:14},{wch:18},{wch:18},{wch:18},{wch:16},{wch:18},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws2,"Summary "+y);
  saveWb(wb,`LP Sales & Expenses ${y}.xlsx`);
}
function exportMonth(y,m){
  const c=calc(y,m);const wb=XLSX.utils.book_new();
  const rep=[["Las Palmas – Monthly sales & expense report"],[`${MONTHS[m-1]} ${y}`],[],
    ["Profit declaration","Sales","Actual expenses","Profit"],
    ["1. Based on collected payments",c.collected,c.expenses,c.net],
    ["2. Based on sales on the books",c.booked,c.expenses,c.netBooked],[],
    ["Stock on hand (reference, not in profit)",c.soh],[],
    ["Income","Amount"],...INCOME.map(i=>[i.l,c.tot[i.k]]),[],
    ["Expenses","Amount","% of expenses"],...EXPENSE.map(e=>[e.l,c.tot[e.k],c.expenses?r2(c.tot[e.k]/c.expenses*100):0])];
  const ws=XLSX.utils.aoa_to_sheet(rep);ws["!cols"]=[{wch:44},{wch:18},{wch:18},{wch:18}];
  XLSX.utils.book_append_sheet(wb,ws,"Report");
  const dp=[["Day","Sales collected","Sales on the books","Actual expenses","Profit (collected)","Profit (on the books)"]];
  for(let i=0;i<c.n;i++)dp.push([i+1,c.dIn[i],c.dBk[i],c.dOut[i],null,null]);
  const dws=XLSX.utils.aoa_to_sheet(dp);
  for(let i=0;i<c.n;i++){const r=i+2;setF(dws,"E"+r,`B${r}-D${r}`,c.pCol[i]);setF(dws,"F"+r,`C${r}-D${r}`,c.pBk[i])}
  const tr=c.n+2;XLSX.utils.sheet_add_aoa(dws,[["Total"]],{origin:"A"+tr});
  ["B","C","D","E","F"].forEach((L,j)=>setF(dws,L+tr,`SUM(${L}2:${L}${tr-1})`,[c.collected,c.booked,c.expenses,c.net,c.netBooked][j]));
  dws["!ref"]="A1:F"+tr;dws["!cols"]=[{wch:8},{wch:16},{wch:18},{wch:16},{wch:18},{wch:20}];
  XLSX.utils.book_append_sheet(wb,dws,"Daily profit");
  XLSX.utils.book_append_sheet(wb,compilationSheet(y,[m]),"Daily entries");
  saveWb(wb,`LP Report ${MONTHS[m-1]} ${y}.xlsx`);
}

/* ---------- Excel import (same layout as the compilation sheet) ---------- */
$("#fileIn").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f||!window.XLSX)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer());const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    let y=S.y,m=null;const out={};
    for(const r of rows){const a=r[0];
      if(typeof a==="number"&&a>=2000&&a<2100){y=a;continue}
      if(typeof a==="string"){const t=a.trim().toUpperCase();const mi=MONTHS.findIndex(n=>n.toUpperCase()===t);
        if(mi>=0){m=mi+1;out[idOf(y,m)]={year:y,month:m,days:{},soh:0};continue}
        if(t==="TOTAL"&&m){const v=r[31];if(typeof v==="number")out[idOf(y,m)].soh=r2(v);continue}}
      if(m&&typeof a==="number"&&Number.isInteger(a)&&a>=1&&a<=31){const day={};
        ALL.forEach((cat,i)=>{const v=r[i+1];if(typeof v==="number"&&v)day[cat.k]=r2(v)});
        if(Object.keys(day).length)out[idOf(y,m)].days[a]=day}
    }
    const ids=Object.keys(out).sort();if(!ids.length){banner("That file doesn't match the compilation layout (month names in column A, day numbers below each month).");return}
    const names=ids.map(id=>{const [yy,mm]=id.split("-");return MONTHS[mm-1].slice(0,3)+" "+yy});
    if(!confirm(`Import ${ids.length} month(s): ${names.join(", ")}?\n\nThis replaces what is saved here for those months.`))return;
    banner("Importing…");
    for(const id of ids){const doc={...out[id],updatedAt:new Date().toISOString()};
      if(S.localMode)S.remote[id]=doc;else await S.db.collection("months").doc(id).set(doc);
      S.remote[id]=doc;delete S.pending[id]}
    if(S.localMode)try{localStorage.setItem(LS_KEY,JSON.stringify(S.remote))}catch(e){}
    banner(`Imported ${ids.length} month(s).`);const [ly,lm]=ids[ids.length-1].split("-").map(Number);S.y=ly;S.m=lm;render();
  }catch(err){banner("Couldn't read that file. Save it as .xlsx and try again.")}
};

/* ---------- Render ---------- */
let lastView="";
function render(){
  syncPeriod();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  ["report","entry","year"].forEach(t=>$("#view-"+t).hidden=t!==S.tab);
  if(!S.loaded){$("#view-"+S.tab).innerHTML=`<div class="empty">Loading entries…</div>`;return}
  if(S.tab==="report")renderReport();else if(S.tab==="entry")renderEntry();else renderYear();
  lastView=S.tab+S.y+S.m+S.mode+S.day;
}
function onRemote(){
  if(S.tab==="entry"&&lastView===S.tab+S.y+S.m+S.mode+S.day&&document.querySelector("#view-entry input")){softRefreshEntry();syncPeriod();return}
  render();
}

/* ---------- Boot ---------- */
render();
(async()=>{
  let db=null,user=null;
  const hasRuntime=!!(window.claude&&typeof window.claude.use==="function");
  if(hasRuntime){try{[db,user,S.downloads]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")])}catch(e){}}
  if(!S.downloads)S.downloads={save:async({filename,data})=>{const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return {status:"saved"}}};
  if(user){try{const w=await user.can("data.write");if(w===false)S.canWrite=false}catch(e){}}
  if(!db){
    S.localMode=true;
    let saved=null;try{saved=localStorage.getItem(LS_KEY)}catch(e){}
    S.remote=saved?JSON.parse(saved):JSON.parse(JSON.stringify(SEED));
    if(!saved)try{localStorage.setItem(LS_KEY,JSON.stringify(S.remote))}catch(e){}
    const ids=Object.keys(S.remote).sort();if(ids.length&&!S.remote[idOf(S.y,S.m)]){const [y,m]=ids[ids.length-1].split("-").map(Number);S.y=y;S.m=m}
    banner("Entries are saved in this browser on this computer. Use Year overview, then Download, to keep an Excel backup.");
    S.loaded=true;render();return;
  }
  S.db=db;
  db.collection("months").onSnapshot(snap=>{
    const next={};snap.docs.forEach(d=>{if(d.exists)next[d.id]=d.data()});S.remote=next;
    if(!S.loaded){S.loaded=true;
      // open the latest month that has entries
      const ids=Object.keys(next).sort();const cur=idOf(S.y,S.m);
      if(ids.length&&!next[cur]){const [y,m]=ids[ids.length-1].split("-").map(Number);S.y=y;S.m=m}
      render();
    }else onRemote();
  },err=>{banner("Live updates stopped ("+err.code+"). Reload the page to reconnect.")});
  $("#who").textContent=S.canWrite?"Monthly report":"Monthly report · view only";
})();
</script>
